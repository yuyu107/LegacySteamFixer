name: Build and release

on:
  push:
    branches:
      - main
    paths:
      - src/AppInfo.cs
      - tools/**
      - .github/workflows/release.yml
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release version
        run: |
          $source = Get-Content src/AppInfo.cs -Raw
          $version = [regex]::Match($source, 'const string Version="([^"]+)"').Groups[1].Value
          $tag = "v$version"
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-test\d+)?$') { throw "Unsupported version: $tag" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne $tag) { throw 'Tag does not match AppInfo.cs' }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
      - name: Rebuild Zstd module
        run: |
          python -m pip install ziglang==0.16.0
          if ($LASTEXITCODE -ne 0) { throw 'ziglang installation failed' }
          python zstd/source/build_module.py
          if ($LASTEXITCODE -ne 0) { throw 'Zstd module build failed' }
      - name: Build Fixer and probes
        run: |
          cmd /c Build.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Managed build failed' }
      - name: Run regression tests
        run: ./tools/test.ps1
      - name: Package runtime and SHA256
        run: |
          python tools/package.py dist
          if ($LASTEXITCODE -ne 0) { throw 'Runtime packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, '--repo', $env:GITHUB_REPOSITORY, '--target', $env:GITHUB_SHA, '--title', $env:RELEASE_TAG, '--notes-file', 'RELEASE_NOTES.md')
          if ($env:RELEASE_TAG -match '-test\d+$') { $releaseArgs += '--prerelease' }
          $releaseArgs += (Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Release already exists; leaving it unchanged'; exit 0 }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; existing releases are not overwritten' }
